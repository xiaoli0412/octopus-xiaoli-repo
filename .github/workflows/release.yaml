name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: validate-before-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.4'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Frontend typecheck and static sync
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec tsc --noEmit && pnpm run build:static

      - name: Frontend unit tests
        working-directory: web
        run: pnpm run test

      - name: Frontend no-browser verification
        working-directory: web
        run: pnpm run test:screenshot-no-browser

      - name: Go build all packages
        run: go build ./...

      - name: Go test targeted packages
        run: go test ./internal/op ./internal/server/handlers ./internal/server/middleware ./internal/relay/... ./internal/task ./internal/update -count=1

      - name: Go race test targeted packages
        run: go test -race ./internal/op ./internal/server/handlers ./internal/server/middleware ./internal/relay/... ./internal/task ./internal/update -count=1

      - name: Linux backend smoke
        run: bash scripts/smoke-linux-backend.sh

  release:
    name: release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      packages: write
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      docker_tag: ${{ steps.release_meta.outputs.docker_tag }}
      app_version: ${{ steps.release_meta.outputs.app_version }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release metadata
        id: release_meta
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          ref_name_lower="${ref_name,,}"
          docker_tag="${ref_name//\(/-}"
          docker_tag="${docker_tag//\)/}"
          docker_tag="${docker_tag// /-}"
          app_version="$(tr -d '\r' < VERSION | head -n 1 | xargs)"
          echo "release_tag=${ref_name}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${docker_tag}" >> "$GITHUB_OUTPUT"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          if [[ "$ref_name_lower" == *beta* || "$ref_name_lower" == *alpha* || "$ref_name_lower" == *rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.4'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build
        run: bash scripts/build.sh release

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/archives/*
          prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
          tag_name: ${{ steps.release_meta.outputs.release_tag }}

  docker-release:
    name: docker-release (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [alpine, debian]
        include:
          - flavor: alpine
            dockerfile: ./scripts/dockerfiles/Dockerfile.alpine
            cache_tag: buildcache-alpine
            tag_suffix: -alpine
            latest_tag: latest-alpine
          - flavor: debian
            dockerfile: ./scripts/dockerfiles/Dockerfile.debian
            cache_tag: buildcache-debian
            tag_suffix: ''
            latest_tag: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.latest_tag }},enable=${{ needs.release.outputs.is_prerelease != 'true' }}
            type=raw,value=${{ needs.release.outputs.docker_tag }}${{ matrix.tag_suffix }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/i386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGETPLATFORM
            APP_VERSION=${{ needs.release.outputs.app_version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:${{ matrix.cache_tag }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:${{ matrix.cache_tag }},mode=max
