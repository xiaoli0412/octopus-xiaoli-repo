apiVersion: v1
kind: ConfigMap
metadata:
  name: octopus-config
  namespace: octopus
  labels:
    app.kubernetes.io/name: octopus
    app.kubernetes.io/part-of: octopus
data:
  # ---- Server ----
  OCTOPUS_SERVER_HOST: "0.0.0.0"
  OCTOPUS_SERVER_PORT: "1088"
  # 前端静态文件目录(嵌入二进制时无需修改)
  # OCTOPUS_SERVER_STATIC_DIR: "static/out"

  # ---- Database ----
  # sqlite(默认,单副本)/ mysql / postgresql(多副本生产推荐)
  OCTOPUS_DATABASE_TYPE: "sqlite"
  # SQLite 文件路径;MySQL/PG 时为连接串或 DSN(改用 Secret 存储凭据)
  OCTOPUS_DATABASE_PATH: "/app/data/data.db"

  # ---- Log ----
  # debug / info / warn / error
  OCTOPUS_LOG_LEVEL: "info"

  # ---- Shutdown(优雅停机) ----
  OCTOPUS_SHUTDOWN_TIMEOUT: "30s"
  OCTOPUS_SHUTDOWN_TASK_TIMEOUT: "10s"

  # ---- HTTP Client(出站连接池调优) ----
  OCTOPUS_HTTP_MAX_IDLE_CONNS: "200"
  OCTOPUS_HTTP_MAX_CONNS_PER_HOST: "100"
  OCTOPUS_HTTP_MAX_IDLE_CONNS_PER_HOST: "100"
  OCTOPUS_HTTP_IDLE_CONN_TIMEOUT: "90s"
  OCTOPUS_HTTP_TLS_HANDSHAKE_TIMEOUT: "10s"
  OCTOPUS_HTTP_EXPECT_CONTINUE_TIMEOUT: "1s"
  OCTOPUS_HTTP_RESPONSE_HEADER_TIMEOUT: "30s"

  # ---- 容器运行时(由 entrypoint 使用,非 Octopus 配置) ----
  DATA_DIR: "/app/data"
  PUID: "10001"
  PGID: "10001"
