apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: octopus-data
  namespace: octopus
  labels:
    app.kubernetes.io/name: octopus
    app.kubernetes.io/part-of: octopus
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: <your-storage-class>
  # 留空则使用集群默认 StorageClass;生产环境建议显式指定。
  resources:
    requests:
      storage: 10Gi
