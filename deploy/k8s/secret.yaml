apiVersion: v1
kind: Secret
metadata:
  name: octopus-secret
  namespace: octopus
  labels:
    app.kubernetes.io/name: octopus
    app.kubernetes.io/part-of: octopus
type: Opaque
# ==============================================================================
# 敏感配置占位符。请勿直接 kubectl apply 本文件中的真实凭据!
# 推荐使用以下方式创建 Secret:
#   kubectl create secret generic octopus-secret -n octopus \
#     --from-literal=OCTOPUS_ADMIN_PASSWORD='your-password' \
#     --from-literal=OCTOPUS_JWT_SECRET='your-jwt-secret' \
#     --from-literal=DATABASE_DSN='octopus:password@tcp(mysql:3306)/octopus'
#
# 或使用 sealed-secrets / external-secrets / Vault 等工具管理。
# 本文件中的 <change-me> 仅占位,apply 后需手动替换或通过上述命令覆盖。
# ==============================================================================
stringData:
  # 管理员初始密码(首次启动初始化使用)
  OCTOPUS_ADMIN_PASSWORD: "<change-me>"
  # JWT 签名密钥(若项目支持环境变量覆盖;否则在数据库 Setting 表管理)
  OCTOPUS_JWT_SECRET: "<change-me>"
  # MySQL/PostgreSQL 连接串(SQLite 模式可留空)
  # 示例(MySQL): octopus:<password>@tcp(mysql.octopus.svc:3306)/octopus?charset=utf8mb4&parseTime=True&loc=Local
  # 示例(PostgreSQL): host=postgres.octopus.svc user=octopus password=<password> dbname=octopus port=5432 sslmode=disable
  DATABASE_DSN: "<change-me>"
